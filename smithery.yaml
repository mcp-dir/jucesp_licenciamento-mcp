# Smithery configuration for JUCESP: Consulta Pública de Licenciamento
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_jucesp_licenciamento

name: jucesp_licenciamento-mcp
displayName: "JUCESP: Consulta Pública de Licenciamento"
description: >
  Consulta pública de licenciamento de uma empresa na Junta Comercial de São Paulo (JUCESP) pelo CNPJ. Hospedado pela plataforma, sem credenciais, pague por consulta com crédito pré-pago.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/jucesp_licenciamento-mcp
repository: https://github.com/mcp-dir/jucesp_licenciamento-mcp

tags:
  - jucesp_licenciamento
  - brazil
  - horizontal
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_jucesp_licenciamento

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_jucesp_licenciamento/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
